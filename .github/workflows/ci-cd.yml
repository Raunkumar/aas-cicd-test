name: CI-CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Run Tests
        run: |
          if [ -f package.json ] && npm list --depth=0 | grep -q jest; then
            npm test
          else
            echo "No tests configured, skipping..."
          fi

  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Run Coverage Report
        run: |
          if [ -f package.json ] && npm list --depth=0 | grep -q jest; then
            npm test -- --coverage
          else
            echo "No coverage configuration found, skipping..."
          fi
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  lint:
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Run ESLint
        run: |
          if [ -f package.json ] && npm list --depth=0 | grep -q eslint; then
            npm run lint || true
          else
            echo "No linting configured, skipping..."
          fi
      - name: Upload Lint Report
        run: |
          echo "ESLint completed."

  security:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Run Security Scan
        run: npm audit --audit-level=high
      - name: Upload Security Report
        run: echo "Security scan completed."

  deploy:
    needs: security
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Create Deployment Artifact
        run: |
          mkdir -p deployment
          cp -r src/ deployment/ || true
          cp package.json README.md deployment/
          zip -r aas-deployment.zip deployment/
      - name: Upload Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aas-deployment
          path: aas-deployment.zip
